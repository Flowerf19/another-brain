[project]
name = "another-brain-fp32-spike"
version = "0.0.0"
description = "Evaluation-only fp32 oracle spike for the Q4 quality gate (Plan 07 GOAL-001). Never packaged or shipped."
requires-python = ">=3.12,<3.13"
dependencies = [
    "sentence-transformers>=5.0,<6",
    # Declared directly so the pytorch-cpu index pin below applies (uv
    # sources don't reach transitive deps); keeps CUDA wheels out.
    "torch>=2.9,<3",
    "numpy>=2.1,<3",
    # transformers 5.x caps tokenizers<=0.23.0 and 0.23.0 was never released,
    # so this env resolves 0.22.2. The q4 side therefore does NOT run here:
    # it runs under the ROOT project's production lock (tokenizers 0.23.1)
    # via `uv run python spikes/fp32/q4_encode.py` from the repo root, so the
    # gate measures the exact production tokenizer/library stack.
    # Tokenizer artifacts are hash-pinned per profile either way.
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=8",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]
