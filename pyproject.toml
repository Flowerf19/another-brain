[build-system]
requires = ["hatchling>=1.31,<2"]
build-backend = "hatchling.build"

[project]
name = "another-brain"
version = "0.11.0"
description = "Shared long-term memory for MCP agents — one brain, many agents. Standalone embedded runtime: SQLite + FTS5 + exact vector hybrid search, local Harrier q4 ONNX embeddings, self-expiring diary model. No server, container, or daemon required."
license = "MIT"
license-files = ["LICENSE"]
# Without this the PyPI project page renders empty.
readme = "README.md"
authors = [{ name = "flowerf19" }]
keywords = ["mcp", "memory", "agents", "sqlite", "embeddings", "rag"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries",
]
requires-python = ">=3.12"
# Locked ranges (Plan 07 TASK-037); exact versions resolve in uv.lock.
dependencies = [
    "mcp>=2.0,<2.1",
    "onnxruntime>=1.28,<1.29",
    "tokenizers>=0.23,<0.24",
    "numpy>=2.1,<3",
    "platformdirs>=4.3,<5",
    # 0.1.9 ships no win_arm64 wheel and no sdist; without this marker the
    # whole tool is uninstallable on Windows ARM64. Runtime degrades to the
    # NumPy exact fallback there (load_vec never raises). TASK-091.
    "sqlite-vec>=0.1.9,<0.2; sys_platform != 'win32' or platform_machine != 'ARM64'",
    # Windows has no system IANA tz database; without tzdata even
    # ZoneInfo("UTC") raises and AppConfig exits EXIT_CONFIG. Pure-data wheel.
    "tzdata>=2024.1; sys_platform == 'win32'",
    "filelock>=3.16,<4",
]

[project.urls]
Homepage = "https://github.com/Flowerf19/another-brain"
Repository = "https://github.com/Flowerf19/another-brain"
Changelog = "https://github.com/Flowerf19/another-brain/blob/main/CHANGELOG.md"
Issues = "https://github.com/Flowerf19/another-brain/issues"

[project.scripts]
another-brain = "another_brain.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
]

[tool.hatch.build.targets.wheel]
packages = ["another_brain"]
# Bundle the skill inside the wheel (TASK-093): `another-brain connect` installs
# the skill from importlib.resources, so no repo clone or Node/npx is needed.
# skills/another-brain/ stays the single editable source; this is a force-include
# only — nothing is copied into the source tree.
force-include = { "skills/another-brain" = "another_brain/skill" }

[tool.hatch.build.targets.sdist]
include = ["another_brain", "skills/another-brain"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "slow: heavyweight gates (wheel build/install, model downloads, concurrency)",
]
