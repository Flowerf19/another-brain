[build-system]
requires = ["hatchling>=1.31,<2"]
build-backend = "hatchling.build"

[project]
name = "another-brain"
version = "0.11.0"
description = "Shared long-term memory for MCP agents — one brain, many agents. Standalone embedded runtime: SQLite + FTS5 + exact vector hybrid search, local Harrier q4 ONNX embeddings, self-expiring diary model. No server, container, or daemon required."
license = "MIT"
requires-python = ">=3.12"
# Locked ranges (Plan 07 TASK-037); exact versions resolve in uv.lock.
dependencies = [
    "mcp>=2.0,<2.1",
    "onnxruntime>=1.28,<1.29",
    "tokenizers>=0.23,<0.24",
    "numpy>=2.1,<3",
    "platformdirs>=4.3,<5",
    # 0.1.9 ships no win_arm64 wheel and no sdist; without this marker the
    # whole tool is uninstallable on Windows ARM64. Runtime degrades to the
    # NumPy exact fallback there (load_vec never raises). TASK-091.
    "sqlite-vec>=0.1.9,<0.2; sys_platform != 'win32' or platform_machine != 'ARM64'",
    "filelock>=3.16,<4",
]

[project.scripts]
another-brain = "another_brain.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
]

[tool.hatch.build.targets.wheel]
packages = ["another_brain"]

[tool.hatch.build.targets.sdist]
include = ["another_brain"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "slow: heavyweight gates (wheel build/install, model downloads, concurrency)",
]
