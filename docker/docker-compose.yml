# Redis Stack for another-brain local dev / integration tests.
# Start with: docker compose -f docker/docker-compose.yml up -d

services:
  redis:
    image: redis/redis-stack-server:7.4.0-v8
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    environment:
      REDIS_ARGS: "--appendonly yes"
    volumes:
      - another-brain-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  another-brain-redis-data:
