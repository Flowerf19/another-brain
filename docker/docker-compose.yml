# Redis 8.8 (Open Source, bundled Query Engine) for another-brain local dev /
# integration tests. 8.4+ is required for native hybrid search (FT.HYBRID).
# Start with: docker compose -f docker/docker-compose.yml up -d

services:
  redis:
    image: redis:8.8
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - another-brain-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  another-brain-redis-data:
