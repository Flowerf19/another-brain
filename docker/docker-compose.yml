# Redis 8.8 (Open Source, bundled Query Engine) for another-brain local dev /
# integration tests. 8.4+ is required for native hybrid search (FT.HYBRID).
#
# Project name is pinned via name: to avoid colliding with March7's compose
# project (both repos use docker/docker-compose.yml, so Docker Compose would
# otherwise derive the same default project name "docker" from the parent
# directory and confuse one repo's redis for the other's).
#
# Start with: docker compose -f docker/docker-compose.yml up -d

name: another-brain

networks:
  another-brain-net:
    driver: bridge

services:
  redis:
    image: redis:8.8
    container_name: another-brain-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    networks:
      - another-brain-net
    ports:
      - "${REDIS_PORT:-1906}:6379"
    volumes:
      - another-brain-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  server:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: another-brain-server:local
    container_name: another-brain-server
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    environment:
      # Internal compose network — the host REDIS_PORT mapping does not apply.
      REDIS_URL: redis://redis:6379
      BRAIN_ID: ${BRAIN_ID:-default}
      # First boot downloads the embedding model into the cache volume.
      MODEL_DOWNLOAD_POLICY: on_start
      MODEL_ALLOW_NETWORK: "true"
    ports:
      - "${MCP_HTTP_PORT:-1905}:1905"
    volumes:
      - another-brain-model-cache:/data/models
    networks:
      - another-brain-net
    healthcheck:
      # Slim image has no curl/wget — probe /health with the venv python.
      # start_period covers the first-boot embedding model download (~0.5 GB),
      # which happens before the HTTP server binds.
      test: ["CMD", "/app/.venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:1905/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 120s

volumes:
  another-brain-redis-data:
  another-brain-model-cache:
