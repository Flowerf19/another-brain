name: unit tests

on:
  push:
    branches: [main, v0.11.0]
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run pytest tests/unit
      - run: scripts/check-clean-tree.sh
