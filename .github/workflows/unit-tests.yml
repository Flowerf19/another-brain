name: unit tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
      # No `--extra local`: unit tests never touch torch/sentence-transformers
      # (those are lazy imports); keeps CI off the multi-GB torch download.
      # Unit tests need no Redis — integration tests stay out of CI for now.
      - run: uv sync --locked
      - run: uv run pytest tests/unit
